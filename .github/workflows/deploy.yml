name: Deploy Murshid App to Server

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-test:
    name: Build & Test (Frontend + Backend)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # ── Backend Setup & Test ──────────────────────────────────────────
      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: 📦 Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: 🧪 Run Django System Checks
        working-directory: ./backend
        run: |
          python manage.py check

      # ── Frontend Setup & Build ────────────────────────────────────────
      - name: 🟢 Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: 📦 Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci || npm install

      - name: 🏗️ Build Frontend Production Bundle
        working-directory: ./frontend
        run: |
          npm run build

  deploy:
    name: 🚀 Deploy to VPS Server
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔌 Deploy via SSH to Remote Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script: |
            set -e
            echo "🚀 Starting Deployment for Murshid..."
            
            # Navigate to project directory
            cd ${{ secrets.SERVER_PATH || '/home/ec2-user/murshid' }}

            # Pull latest changes from main branch
            git fetch origin
            git reset --hard origin/main

            # ── Backend Deployment ─────────────────────────────────────
            echo "🐍 Updating Backend..."
            cd backend
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            source venv/bin/activate
            pip install -r requirements.txt
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput

            # Restart Django service (Systemd / PM2 / Gunicorn)
            if systemctl is-active --quiet murshid-backend; then
              sudo systemctl restart murshid-backend
              echo "✅ Django service (murshid-backend) restarted."
            elif systemctl is-active --quiet gunicorn; then
              sudo systemctl restart gunicorn
              echo "✅ Gunicorn service restarted."
            elif command -v pm2 &> /dev/null; then
              pm2 restart all || echo "PM2 restart attempted."
              echo "✅ PM2 processes restarted."
            fi

            # ── Frontend Deployment ────────────────────────────────────
            echo "🟢 Updating Frontend..."
            cd ../frontend
            npm install --production=false
            npm run build

            # Copy built dist files to Nginx web root (/var/www/tammo)
            if [ -d "/var/www/tammo" ]; then
              sudo cp -r dist/* /var/www/tammo/
              echo "✅ Frontend dist copied to /var/www/tammo"
            elif [ -d "/var/www/murshid" ]; then
              sudo cp -r dist/* /var/www/murshid/
              echo "✅ Frontend dist copied to /var/www/murshid"
            fi

            # Reload Nginx web server if present
            if command -v nginx &> /dev/null; then
              sudo systemctl reload nginx || sudo service nginx reload || true
              echo "✅ Nginx reloaded."
            fi

            echo "🎉 Deployment Successfully Completed!"
